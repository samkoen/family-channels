<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Family Channels player</title>
  <style>
    html, body { margin: 0; padding: 0; background: #000; width: 100%; height: 100%; overflow: hidden; }
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    #player-box {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      background: #000;
      overflow: hidden;
    }
    #player-box iframe,
    #player {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      border: 0;
    }
    #end-lock {
      position: absolute;
      inset: 0;
      z-index: 5;
      background: #000;
    }
    #end-lock[hidden] { display: none; }
    #dbg {
      display: none; /* passer SHOW_DEBUG_UI à true dans le script pour réafficher */
      position: fixed; left: 0; right: 0; bottom: 0; max-height: 28%;
      overflow: auto; margin: 0; padding: 6px 8px;
      background: rgba(0,0,0,0.85); color: #7dff7d;
      font: 11px/1.35 monospace; white-space: pre-wrap; z-index: 9999;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="player-box">
      <div id="player"></div>
      <div id="end-lock" hidden></div>
    </div>
  </div>
  <pre id="dbg"></pre>
  <script>
    var SHOW_DEBUG_UI = false;
    function dbg(msg) {
      var line = new Date().toISOString().slice(11, 19) + " " + msg;
      if (SHOW_DEBUG_UI) {
        var el = document.getElementById("dbg");
        if (el) {
          el.style.display = "block";
          el.textContent += line + "\n";
        }
      }
      if (window.Android && Android.log) Android.log(line);
    }
    var params = new URLSearchParams(window.location.search);
    var videoId = params.get("v") || "";
    dbg("static player origin=" + location.origin);
    dbg("video=" + videoId);
  </script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    var videoId = new URLSearchParams(window.location.search).get("v") || "";
    var player;
    var pendingId = "";
    function hideEndLock() {
      var lock = document.getElementById("end-lock");
      if (lock) lock.hidden = true;
    }
    function revertVideo() {
      try { if (player && player.loadVideoById) player.loadVideoById(videoId); } catch (err) {}
    }
    window.onCanPlayResult = function (id, allowed) {
      if (id && id === pendingId && allowed) {
        videoId = id;
        hideEndLock();
        dbg("allowed related=" + id);
      } else if (id && id === pendingId) {
        dbg("denied related=" + id);
        revertVideo();
      }
    };
    function enforceSameChannel() {
      if (!player || !player.getVideoData) return;
      try {
        var data = player.getVideoData();
        var next = data && data.video_id;
        if (!next || next === videoId) return;
        pendingId = next;
        if (window.Android && Android.requestCanPlay) {
          Android.requestCanPlay(next);
        } else {
          videoId = next;
        }
      } catch (err) {}
    }
    function onYouTubeIframeAPIReady() {
      dbg("YouTube IFrame API ready");
      player = new YT.Player("player", {
        width: "100%",
        height: "100%",
        videoId: videoId,
        playerVars: {
          autoplay: 1,
          playsinline: 1,
          rel: 0,
          modestbranding: 1,
          fs: 1,
          iv_load_policy: 3,
          origin: location.origin
        },
        events: {
          onReady: function (e) {
            dbg("YT onReady");
            try { e.target.playVideo(); } catch (err) { dbg("playVideo err: " + err); }
            if (window.Android && Android.onReady) Android.onReady();
          },
          onStateChange: function (e) {
            dbg("YT state=" + e.data);
            if (window.Android && Android.onState) Android.onState(String(e.data));
            enforceSameChannel();
          },
          onError: function (e) {
            dbg("YT onError code=" + e.data);
            if (window.Android && Android.onError) Android.onError(String(e.data));
          }
        }
      });
    }
  </script>
</body>
</html>
