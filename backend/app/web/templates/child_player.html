{% extends "child_base.html" %}
{% block title %}{{ t.watch_title }}{% endblock %}
{% block content %}
<main class="wrap">
  <section class="panel player-panel">
    <div class="row-between">
      <a class="back" href="/watch/channels/{{ channel_id }}">{{ t.back_videos }}</a>
      <span class="live-dot" aria-hidden="true"></span>
    </div>
    <p class="quota-live" id="quota-live"
       data-remaining="{{ quota.minutes_remaining }}"
       data-used="{{ quota.minutes_used }}"
       data-limit="{{ quota.daily_limit_minutes }}">
      {{ t.min_used.format(used=quota.minutes_used, limit=quota.daily_limit_minutes) }}
      · {{ t.min_left.format(n=quota.minutes_remaining) }}
    </p>
    <div class="player" dir="ltr" id="player-wrap">
      <iframe
        id="yt-frame"
        src="https://www.youtube.com/embed/{{ video_id }}?rel=0&modestbranding=1&playsinline=1&fs=1"
        title="video"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </div>
  </section>
</main>
<script>
(function () {
  var label = document.getElementById("quota-live");
  var leftTpl = {{ t.min_left|tojson }};
  var usedTpl = {{ t.min_used|tojson }};
  var homeUrl = "/watch/home";
  var lastTick = Date.now();

  function render(used, remaining, limit) {
    if (!label) return;
    var usedText = String(usedTpl).split("{used}").join(String(used)).split("{limit}").join(String(limit));
    var leftText = String(leftTpl).split("{n}").join(String(remaining));
    label.textContent = usedText + " · " + leftText;
    label.dataset.remaining = String(remaining);
    label.dataset.used = String(used);
  }

  function stopPlayback() {
    var frame = document.getElementById("yt-frame");
    if (frame) frame.remove();
    window.location.href = homeUrl;
  }

  async function consume(minutes) {
    if (minutes < 1) return;
    try {
      var res = await fetch("/watch/heartbeat.json", {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Accept": "application/json",
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ minutes: minutes }),
      });
      var data = await res.json();
      if (!data.can_watch) {
        stopPlayback();
        return;
      }
      render(data.minutes_used, data.minutes_remaining, data.daily_limit_minutes);
    } catch (e) {
      // ignore transient network errors; next tick will retry
    }
  }

  setInterval(function () {
    if (document.hidden) return;
    var now = Date.now();
    var elapsedMin = Math.floor((now - lastTick) / 60000);
    if (elapsedMin < 1) return;
    lastTick = now;
    consume(elapsedMin);
  }, 15000);
})();
</script>
{% endblock %}
