{% extends "base.html" %}
{% block title %}{{ t.login_title }}{% endblock %}
{% block body_class %}is-auth{% endblock %}
{% block body %}
<main class="auth-shell">
  <section class="auth-hero">
    <p class="brand-hero" dir="ltr">Family Channels</p>
    <p class="lede">{{ t.login_lede }}</p>
    <div class="panel flat">
      <h1>{{ t.login_h1 }}</h1>
      {% if error %}
      <p class="error">{{ t.invalid_credentials }}</p>
      {% endif %}
      <form method="post" action="/login" class="stack">
        <label>{{ t.family_code }}
          <input name="family_code" required autocomplete="username" placeholder="AB12CD" dir="ltr" />
        </label>
        <label>{{ t.pin }}
          <input type="password" name="pin" inputmode="numeric" pattern="[0-9]{4,6}" required autocomplete="current-password" dir="ltr" />
        </label>
        <div class="form-actions">
          <button type="submit">{{ t.sign_in }}</button>
        </div>
      </form>
      <p class="auth-footer"><a href="/">{{ t.create_new_family }}</a></p>
    </div>
  </section>
</main>
{% endblock %}
