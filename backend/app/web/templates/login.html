{% extends "base.html" %}
{% block title %}{{ t.login_title }}{% endblock %}
{% block body_class %}is-auth{% endblock %}
{% block body %}
<main class="auth-shell">
  <section class="auth-hero">
    <div class="auth-logo">
      <span class="logo-mark" aria-hidden="true"></span>
    </div>
    <p class="brand-hero" dir="ltr">Family Channels</p>
    <p class="lede">{{ t.login_lede }}</p>
    <div class="panel flat">
      <h1>{{ t.login_h1 }}</h1>
      {% if error %}
      <p class="error">{{ t.invalid_credentials }}</p>
      {% endif %}
      <form method="post" action="/login" enctype="application/x-www-form-urlencoded" class="stack" autocomplete="on">
        <label for="family_name">{{ t.family_name }}
          <input
            id="family_name"
            name="family_name"
            type="text"
            required
            autocomplete="username"
            placeholder="{{ t.family_name_ph }}"
            value="{{ family_name or '' }}"
            dir="ltr"
          />
        </label>
        <label for="pin">{{ t.pin_optional }}
          <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,6}" autocomplete="current-password" dir="ltr" />
        </label>
        <div class="form-actions">
          <button type="submit">{{ t.sign_in }}</button>
        </div>
      </form>
      <p class="auth-footer"><a href="/">{{ t.create_new_family }}</a></p>
    </div>
  </section>
</main>
{% endblock %}
