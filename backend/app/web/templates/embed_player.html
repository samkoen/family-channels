<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Family Channels player</title>
  <style>
    html, body { margin: 0; padding: 0; background: #000; width: 100%; height: 100%; overflow: hidden; }
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    /* Keep the iframe at 16:9. Extra height lets YouTube paint a "YouTube"
       button and unrelated videos under the player. */
    #player-box {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      background: #000;
      overflow: hidden;
    }
    #player-box iframe,
    #player {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      border: 0;
    }
    #end-lock {
      position: absolute;
      inset: 0;
      z-index: 5;
      background: #000;
    }
    #end-lock[hidden] { display: none; }
    #fc-yt-logo-block, #fc-yt-watermark-block, #fc-more-btn {
      position: absolute; z-index: 20; border: 0; pointer-events: auto;
    }
    #fc-yt-logo-block { left: 0; bottom: 0; width: 72%; height: 64px; }
    #fc-yt-watermark-block { top: 0; right: 0; width: 140px; height: 56px; }
    #fc-more-btn {
      left: 58px; bottom: 10px; z-index: 21; width: auto; height: auto;
      padding: 6px 10px; border-radius: 8px; cursor: pointer;
      background: rgba(8, 10, 14, 0.88); color: #eef3f7; font: 650 12px/1.2 sans-serif;
    }
    #fc-more-panel {
      position: absolute; inset: 0; z-index: 22; overflow: auto;
      background: rgba(8, 10, 14, 0.94); color: #eef3f7; padding: 10px 10px 56px;
    }
    #fc-more-panel[hidden] { display: none; }
    #dbg {
      display: none; /* passer SHOW_DEBUG_UI à true dans le script pour réafficher */
      position: fixed; left: 0; right: 0; bottom: 0; max-height: 28%;
      overflow: auto; margin: 0; padding: 6px 8px;
      background: rgba(0,0,0,0.85); color: #7dff7d;
      font: 11px/1.35 monospace; white-space: pre-wrap; z-index: 9999;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="player-box">
      <div id="player"></div>
      <div id="end-lock" hidden></div>
    </div>
  </div>
  <pre id="dbg"></pre>
  <script>
    var SHOW_DEBUG_UI = false;
    function dbg(msg) {
      var line = new Date().toISOString().slice(11, 19) + " " + msg;
      if (SHOW_DEBUG_UI) {
        var el = document.getElementById("dbg");
        if (el) {
          el.style.display = "block";
          el.textContent += line + "\n";
        }
      }
      if (window.Android && Android.log) Android.log(line);
    }
    dbg("embed page origin=" + location.origin);
    dbg("video={{ video_id }}");
  </script>
  <script src="/static/player_guard.js?v=3"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    var videoId = "{{ video_id }}";
    var player;
    var pendingId = "";
    function hideEndLock() {
      var lock = document.getElementById("end-lock");
      if (lock) lock.hidden = true;
    }
    function revertVideo() {
      try { if (player && player.loadVideoById) player.loadVideoById(videoId); } catch (err) {}
    }
    window.onCanPlayResult = function (id, allowed) {
      if (id && id === pendingId && allowed) {
        videoId = id;
        hideEndLock();
        try { if (player && player.loadVideoById) player.loadVideoById(id); } catch (err) {}
        dbg("allowed related=" + id);
      } else if (id && id === pendingId) {
        dbg("denied related=" + id);
        revertVideo();
      }
    };
    function requestRelated(id) {
      if (!id || id === videoId) return;
      pendingId = id;
      if (window.Android && Android.requestCanPlay) {
        Android.requestCanPlay(id);
        return;
      }
      videoId = id;
      hideEndLock();
      try { if (player && player.loadVideoById) player.loadVideoById(id); } catch (err) {}
    }
    FamilyPlayerGuard.install({
      box: document.getElementById("player-box"),
      getVideoId: function () { return videoId; },
      getPlayer: function () { return player; },
      onRelated: requestRelated
    });
    function enforceSameChannel() {
      if (!player || !player.getVideoData) return;
      try {
        var data = player.getVideoData();
        var next = data && data.video_id;
        if (!next || next === videoId) return;
        requestRelated(next);
      } catch (err) {}
    }
    function onYouTubeIframeAPIReady() {
      dbg("YouTube IFrame API ready");
      player = FamilyPlayerGuard.createPlayer("player", videoId, {
        onReady: function (e) {
          dbg("YT onReady");
          try { e.target.playVideo(); } catch (err) { dbg("playVideo err: " + err); }
          if (window.Android && Android.onReady) Android.onReady();
        },
        onStateChange: function (e) {
          dbg("YT state=" + e.data);
          if (window.Android && Android.onState) Android.onState(String(e.data));
          enforceSameChannel();
        },
        onError: function (e) {
          dbg("YT onError code=" + e.data);
          if (e.data === 101 || e.data === 150 || e.data === 153) {
            document.body.innerHTML =
              '<p style="color:#eef3f7;font:16px/1.4 sans-serif;padding:24px;text-align:center">' +
              "Cette vidéo ne peut pas être lue ici : le créateur a bloqué la lecture hors YouTube." +
              "</p>";
          }
          if (window.Android && Android.onError) Android.onError(String(e.data));
        }
      });
    }
    setTimeout(function () {
      if (typeof YT === "undefined") dbg("TIMEOUT: YT undefined after 8s");
    }, 8000);
  </script>
</body>
</html>
